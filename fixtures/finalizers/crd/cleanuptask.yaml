apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: cleanuptasks.cleanup.reliability.flatspell.io
spec:
  group: cleanup.reliability.flatspell.io
  scope: Namespaced
  names: {plural: cleanuptasks, singular: cleanuptask, kind: CleanupTask}
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [allocationName]
              properties:
                allocationName: {type: string, pattern: '^allocation-[a-z0-9-]+$'}
