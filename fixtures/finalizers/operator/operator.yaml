apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanup-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cleanup-operator
rules:
  - apiGroups: [cleanup.reliability.flatspell.io]
    resources: [cleanuptasks]
    verbs: [get, list, patch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cleanup-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cleanup-operator
subjects:
  - kind: ServiceAccount
    name: cleanup-operator
    namespace: workbook-09
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cleanup-operator
spec:
  replicas: 1
  selector:
    matchLabels: {app: cleanup-operator}
  template:
    metadata:
      labels: {app: cleanup-operator}
    spec:
      serviceAccountName: cleanup-operator
      containers:
        - name: operator
          image: docker.io/library/python:3.12-alpine
          command: [python, -u, /operator/controller.py]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
          volumeMounts:
            - name: code
              mountPath: /operator
              readOnly: true
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
      volumes:
        - name: code
          configMap: {name: cleanup-operator-code}
